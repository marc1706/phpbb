<!-- INCLUDE overall_header.html -->

<div class="modern-container">
	<div class="row">
		<div class="col-lg-10 mx-auto">
			<!-- IF TOPIC_TITLE -->
				<div class="modern-page-header">
					<h2 class="modern-page-title"><!-- EVENT posting_topic_title_before --><a href="{U_VIEW_TOPIC}" class="modern-link">{TOPIC_TITLE}</a><!-- EVENT posting_topic_title_after --></h2>
				</div>
			<!-- ELSE -->
				<div class="modern-page-header">
					<h2 class="modern-page-title"><a href="{U_VIEW_FORUM}" class="modern-link">{FORUM_NAME}</a></h2>
				</div>
			<!-- ENDIF -->

			<!-- IF S_FORUM_RULES -->
				<div class="modern-card modern-rules-card">
					<div class="modern-card-header">
						<h3 class="modern-card-title">{L_FORUM_RULES}</h3>
					</div>
					<div class="modern-card-body">
						<!-- IF U_FORUM_RULES -->
							<a href="{U_FORUM_RULES}" class="modern-link">{L_FORUM_RULES}</a>
						<!-- ELSE -->
							{FORUM_RULES}
						<!-- ENDIF -->
					</div>
				</div>
			<!-- ENDIF -->

			<form id="postform" method="post" action="{S_POST_ACTION}"{S_FORM_ENCTYPE}>

				<!-- IF S_DRAFT_LOADED -->
					<div class="modern-card modern-alert-info">
						<div class="modern-card-header">
							<h3 class="modern-card-title">{L_INFORMATION}</h3>
						</div>
						<div class="modern-card-body">
							<p>{L_DRAFT_LOADED}</p>
						</div>
					</div>
				<!-- ENDIF -->

				<!-- IF S_SHOW_DRAFTS --><!-- INCLUDE drafts.html --><!-- ENDIF -->

				<!-- IF S_POST_REVIEW --><!-- INCLUDE posting_review.html --><!-- ENDIF -->

				<!-- IF S_DISPLAY_PREVIEW --><!-- INCLUDE posting_preview.html --><!-- ENDIF -->

				<div class="modern-card modern-posting-form" id="postingbox">
					<div class="modern-card-header">
						<h3 class="modern-card-title">{L_POST_A}</h3>
					</div>
					<div class="modern-card-body">
						<!-- DEFINE $EXTRA_POSTING_OPTIONS = 1 -->
						<!-- INCLUDE posting_editor.html -->
						<input type="hidden" name="show_panel" value="options-panel" />
	{S_FORM_TOKEN}
	</div>
</div>

<!-- IF S_SHOW_ATTACH_BOX and FILTERS --><!-- INCLUDE posting_attach_body.html --><!-- ENDIF -->

<!-- IF S_SHOW_POLL_BOX or S_POLL_DELETE --><!-- INCLUDE posting_poll_body.html --><!-- ENDIF -->

<!-- EVENT posting_layout_include_panel_body -->

<!-- IF S_DISPLAY_REVIEW --><!-- INCLUDE posting_topic_review.html --><!-- ENDIF -->

</form>

<!-- INCLUDE overall_footer.html -->
