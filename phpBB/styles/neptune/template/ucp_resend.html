{% extends "base.html.twig" %}

{% block content %}
	<!-- phpBB Modern prosilver Tailwind: ucp_resend.html -->
	<div class="max-w-2xl mx-auto py-6 sm:py-10">
		<form action="{{ S_PROFILE_ACTION }}" method="post" id="resend">

			<div class="panel bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm p-4 sm:p-6 space-y-4">

				<h2 class="text-lg sm:text-xl font-black text-slate-800 dark:text-white tracking-tight">{{ lang('UCP_RESEND') }}</h2>

				<fieldset>
					<div class="grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-4 py-3 border-b border-slate-100 dark:border-slate-800">
						<div class="sm:col-span-1">
							<label for="username" class="block text-sm font-semibold text-slate-800 dark:text-slate-200">{{ lang('USERNAME') ~ lang('COLON') }}</label>
						</div>
						<div class="sm:col-span-2 space-y-2">
							<input type="text" name="username" id="username" size="25" class="inputbox narrow w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-prosilver-500 focus:border-prosilver-500 transition-colors" />
						</div>
					</div>

					<div class="grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-4 py-3 border-b border-slate-100 dark:border-slate-800">
						<div class="sm:col-span-1">
							<label for="email" class="block text-sm font-semibold text-slate-800 dark:text-slate-200">{{ lang('EMAIL_ADDRESS') ~ lang('COLON') }}</label>
							<span class="block text-xs text-slate-500 dark:text-slate-400 mt-0.5">{{ lang('EMAIL_REMIND') }}</span>
						</div>
						<div class="sm:col-span-2 space-y-2">
							<input type="email" name="email" id="email" size="25" maxlength="100" class="inputbox narrow w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-prosilver-500 focus:border-prosilver-500 transition-colors" />
						</div>
					</div>

					<div class="flex flex-wrap items-center justify-end gap-2 pt-4">
						{{ S_HIDDEN_FIELDS }}{{ S_FORM_TOKEN }}<input type="submit" name="submit" id="submit" value="{{ lang('SUBMIT') }}" tabindex="2" class="button1 button button-form inline-flex items-center gap-1.5 px-4 py-2 text-sm font-bold text-white bg-prosilver-600 hover:bg-prosilver-500 rounded-lg shadow-sm cursor-pointer transition-colors focus:outline-none focus:ring-2 focus:ring-prosilver-500 focus:ring-offset-2 dark:focus:ring-offset-slate-900" />
					</div>
				</fieldset>
			</div>
		</form>
	</div>
{% endblock %}
