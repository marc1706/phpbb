<!-- INCLUDE overall_header.html -->

<div class="modern-container">
	<div class="row justify-content-center">
		<div class="col-lg-6 col-md-8">
			<div class="modern-card login-card">
				<div class="modern-card-header">
					<h2 class="modern-card-title"><!-- IF LOGIN_EXPLAIN -->{LOGIN_EXPLAIN}<!-- ELSE -->{L_LOGIN}<!-- ENDIF --></h2>
				</div>

				<form action="{S_LOGIN_ACTION}" method="post" id="login" data-focus="<!-- IF S_ADMIN_AUTH -->{PASSWORD_CREDENTIAL}<!-- ELSE -->{USERNAME_CREDENTIAL}<!-- ENDIF -->">
					<div class="modern-card-body">
						<!-- IF LOGIN_ERROR --><div class="modern-alert modern-alert-danger">{LOGIN_ERROR}</div><!-- ENDIF -->
						
						<div class="modern-form-group">
							<label for="{USERNAME_CREDENTIAL}" class="modern-form-label">{L_USERNAME}{L_COLON}</label>
							<input type="text" tabindex="1" name="{USERNAME_CREDENTIAL}" id="{USERNAME_CREDENTIAL}" 
								   value="{USERNAME}" class="modern-form-control" autocomplete="username" />
						</div>

						<div class="modern-form-group">
							<label for="{PASSWORD_CREDENTIAL}" class="modern-form-label">{L_PASSWORD}{L_COLON}</label>
							<input type="password" tabindex="2" id="{PASSWORD_CREDENTIAL}" name="{PASSWORD_CREDENTIAL}" 
								   class="modern-form-control" autocomplete="current-password" />
							<!-- IF S_DISPLAY_FULL_LOGIN and (U_SEND_PASSWORD or U_RESEND_ACTIVATION) -->
								<div class="modern-form-links">
									<!-- IF U_SEND_PASSWORD --><a href="{U_SEND_PASSWORD}" class="modern-link">{L_FORGOT_PASS}</a><!-- ENDIF -->
									<!-- IF U_RESEND_ACTIVATION --><!-- IF U_SEND_PASSWORD --> | <!-- ENDIF --><a href="{U_RESEND_ACTIVATION}" class="modern-link">{L_RESEND_ACTIVATION}</a><!-- ENDIF -->
								</div>
							<!-- ENDIF -->
						</div>

						<!-- IF CAPTCHA_TEMPLATE and S_CONFIRM_CODE -->
							<!-- DEFINE $CAPTCHA_TAB_INDEX = 3 -->
							<!-- INCLUDE {CAPTCHA_TEMPLATE} -->
						<!-- ENDIF -->

						<!-- IF S_DISPLAY_FULL_LOGIN -->
						<div class="modern-form-group">
							<!-- IF S_AUTOLOGIN_ENABLED -->
								<div class="modern-form-check">
									<input type="checkbox" name="autologin" id="autologin" tabindex="4" checked class="modern-form-check-input" />
									<label for="autologin" class="modern-form-check-label">{L_LOG_ME_IN}</label>
								</div>
							<!-- ENDIF -->
							<div class="modern-form-check">
								<input type="checkbox" name="viewonline" id="viewonline" tabindex="5" class="modern-form-check-input" />
								<label for="viewonline" class="modern-form-check-label">{L_HIDE_ME}</label>
							</div>
						</div>
						<!-- ENDIF -->

						{S_LOGIN_REDIRECT}
						{S_FORM_TOKEN_LOGIN}
						{S_HIDDEN_FIELDS}
						
						<div class="modern-form-actions">
							<button type="submit" name="login" tabindex="6" class="modern-btn modern-btn-primary modern-btn-lg w-100">
								{L_LOGIN}
							</button>
						</div>
					</div>
				</form>

				<!-- IF not S_ADMIN_AUTH and PROVIDER_TEMPLATE_FILE -->
					<div class="modern-card-body">
						<!-- INCLUDE {PROVIDER_TEMPLATE_FILE} -->
					</div>
				<!-- ENDIF -->
			</div>

			<!-- IF not S_ADMIN_AUTH and S_REGISTER_ENABLED -->
				<div class="modern-card register-card mt-4">
					<div class="modern-card-header">
						<h3 class="modern-card-title">{L_REGISTER}</h3>
					</div>
					<div class="modern-card-body">
						<p class="modern-text-muted">{L_LOGIN_INFO}</p>
						<div class="modern-links mb-3">
							<a href="{U_TERMS_USE}" class="modern-link">{L_TERMS_USE}</a> | 
							<a href="{U_PRIVACY}" class="modern-link">{L_PRIVACY}</a>
						</div>
						<a href="{U_REGISTER}" class="modern-btn modern-btn-outline-primary modern-btn-lg w-100">{L_REGISTER}</a>
					</div>
				</div>
			<!-- ENDIF -->
		</div>
	</div>
</div>

<!-- INCLUDE overall_footer.html -->
