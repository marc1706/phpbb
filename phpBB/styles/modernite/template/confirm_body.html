<!-- IF S_AJAX_REQUEST -->
	<form action="{S_CONFIRM_ACTION}" method="post">
		<div class="modern-card">
			<div class="modern-card-header">
				<h3 class="modern-card-title">{MESSAGE_TITLE}</h3>
			</div>
			<div class="modern-card-body">
				<p class="modern-text-content">{MESSAGE_TEXT}</p>
				<div class="modern-form-actions">
					<input type="button" name="confirm" value="{L_YES}" class="modern-btn modern-btn-primary" />
					<input type="button" name="cancel" value="{L_NO}" class="modern-btn modern-btn-secondary" />
				</div>
			</div>
		</div>
	</form>

<!-- ELSE -->

<!-- INCLUDE overall_header.html -->

<div class="modern-container">
	<form id="confirm" action="{S_CONFIRM_ACTION}" method="post">
	<div class="modern-card">
		<div class="modern-card-header">
			<h2 class="modern-card-title">{MESSAGE_TITLE}</h2>
		</div>
	<p>{MESSAGE_TEXT}</p>

	<fieldset class="submit-buttons">
		{S_HIDDEN_FIELDS}
		<input type="submit" name="confirm" value="{L_YES}" class="button1 button button-form-bold" />&nbsp;
		<input type="submit" name="cancel" value="{L_NO}" class="button1 button button-form-bold" />
	</fieldset>

	</div>
</div>
</form>

<!-- INCLUDE overall_footer.html -->

<!-- ENDIF -->
